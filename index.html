    <div id="static"></div>
    <div id="flash"></div>

    <h1>BuilderIO Preview Tools</h1>

    <!-- LOCALE CHANGE -->
    <form style="
    gap: 4px;
    display: flex;
    flex-direction: column;" id="localeSwitch">
        <label for="localeDropDown">Switch preview locale:</label>
        <div style="
            display: flex;
            gap: 8px;
            ">
            <select style="
                        width:100%;
                        height:32px;
                    " id="localeDropDown">
                <option disabled selected>Choose a locale...</option>
                <option value="en-us/Default">Default</option>
                <option value="en-gb">en-gb</option>
                <option value="it-it">it-it</option>
                <option value="fr-fr">fr-fr</option>
                <option value="de-de">de-de</option>
                <option value="es-es">es-es</option>
            </select>
            <button style="width:33%" id="localeSubmitButton" type="submit">Switch</button>
        </div>
    </form>

    <!-- URL PARAM MANAGER -->

    <form style="
    gap: 4px;
    display: flex;
    flex-direction: column;" id="urlParamSwitch">
        <label for="urlParamDropDown">Add a URL parameter:</label>
        <div style="
            display: flex;
            gap: 8px;
            ">
            <select style="
                        width:100%;
                        height:32px;
                    " id="urlParamDropDown">
                <option disabled selected>Choose a parameter...</option>
                <option value="?circuitVersion=canary">CircuitUI preview</option>
                <option value="?builder.space=88f4521621a94d8eb05a1dc7e9d1ce37">Brand Revamp live view</option>
                <option value="?qa=builder">Builder Rebrand QA</option>



            </select>
            <button style="width:33%" id="urlParamSubmitButton" type="submit">Add</button>
        </div>
    </form>

    <button style="margin-top:16px;   display: flex;justify-content: center;
    align-items: center;
    gap: 8px;" id="openButton">
        <img style="filter:invert(1)" src="https://circuit.sumup.com/icons/v2/external_link_16.svg">
        Open this page in BuilderIO</button>

    <!-- <button id="detectSymbolsButton" style="margin-top:16px;width:100%;">
        Detect Symbols
    </button> -->

    <div id="buttonArea">
        <div id="buttonNearArea" style="width:100%;height:50%;display:flex;justify-content: center;"><button
                id="neonButton" style="z-index: 4;font-size:10px;height:24px;background-color: none;">Hacker
                mode</button>
        </div>
    </div>
